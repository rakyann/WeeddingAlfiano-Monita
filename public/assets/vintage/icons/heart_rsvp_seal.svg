<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 120" width="130" height="120" fill="none">
  <defs>
    <radialGradient id="heartWax" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C52B43" />
      <stop offset="45%" stop-color="#9C172C" />
      <stop offset="85%" stop-color="#6F0C1D" />
      <stop offset="100%" stop-color="#4A0511" />
    </radialGradient>
    <filter id="heartShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.2)" />
    </linearGradient>
  </defs>

  <!-- Outer Embossed Red Wax Heart Body -->
  <path d="
    M 65 24
    C 55 4, 10 8, 14 46
    C 18 68, 65 102, 65 102
    C 65 102, 112 68, 116 46
    C 120 8, 75 4, 65 24
    Z"
    fill="url(#heartWax)"
    stroke="#D13B53"
    stroke-width="1.8"
    filter="url(#heartShadow)"
  />

  <!-- Inner Embossed Stitched Accent -->
  <path d="
    M 65 28
    C 57 12, 22 16, 25 46
    C 28 62, 65 92, 65 92
    C 65 92, 102 62, 105 46
    C 108 16, 73 12, 65 28
    Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.35)"
    stroke-width="1"
    stroke-dasharray="2.5 2.5"
  />

  <!-- Subtle Center Embossed Heart Impression -->
  <path d="
    M 65 42
    C 60 32, 40 34, 42 50
    C 44 62, 65 78, 65 78
    C 65 78, 86 62, 88 50
    C 90 34, 70 32, 65 42
    Z"
    fill="rgba(0,0,0,0.12)"
    stroke="rgba(255,255,255,0.2)"
    stroke-width="0.8"
  />
</svg>
